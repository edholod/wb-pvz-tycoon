let notificationFilter='all';
function notificationPage(){notificationInit();const options=[['all','Все'],['incident','Происшествия'],['review','Отзывы'],['finance','Финансы'],['audit','Проверки']];

}
const renderWithAudit=render;
render=function(){notificationScan();renderWithAudit();if(tab==='Уведомления')document.getElementById('content').innerHTML=box('Игровая дата и время',`<b>${stamp()}</b>`)+notificationPage();const count=s.notifications.filter(n=>!n.read).length;const badge=document.getElementById('bell-count');badge.hidden=!count;badge.textContent=count>99?'99+':count;save();};

render();setInterval(()=>{sync();if(!document.querySelector('input:focus,textarea:focus,select:focus'))render()},5000);
